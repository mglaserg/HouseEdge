[project]
name = "houseedge-lp"
version = "0.1.7"
description = "HouseEdge LP: preregistered AMM liquidity research and hedged event replay"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "web3>=7.0",
  "httpx>=0.27",
  "websockets>=13",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
houseedge = "houseedge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/houseedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
